version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - VITE_API_URL=$VITE_API_URL VITE_KAKAO_REDIRECT_URI=$VITE_KAKAO_REDIRECT_URI npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*